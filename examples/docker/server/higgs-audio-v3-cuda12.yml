services:
  audiocpp-server:
    image: ghcr.io/0xshug0/audio.cpp:full-cuda12
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "49112:8080"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./../models:/models:ro
      - ./../references:/references:ro
      - ./higgs-audio-v3-server.json:/app/server.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: ["server", "--config", "/app/server.json"]
